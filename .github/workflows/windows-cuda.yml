name: Windows CUDA Autobuild

on:
  workflow_dispatch: # Allows you to manually click a button to start the build

jobs:
  build-windows-cuda:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup MSVC (Visual Studio Compiler)
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install CUDA Toolkit
        uses: Jimver/cuda-toolkit@v0.2.35
        with:
          cuda: '12.4.0' # Uses the explicit 3-part version string to pass validation
          method: 'network'
          # This exact multi-line pipe formatting ensures Windows handles the JSON quotes correctly
          sub-packages: |
            [
              "nvcc",
              "cudart",
              "cublas",
              "cublas_dev",
              "thrust",
              "visual_studio_integration"
            ]

      - name: Configure CMake with CUDA
        run: |
          cmake -B build -S . `
            -G "Visual Studio 17 2022" `
            -A x64 `
            -DGGML_CUDA=ON `
            -DCMAKE_CUDA_ARCHITECTURES="75" `
            -DBUILD_SHARED_LIBS=OFF `
            -DLAMA_STATIC=ON `
            -DLLAMA_OPENSSL=OFF `
            -DCMAKE_BUILD_TYPE=Release

      - name: Compile Executables
        run: |
          # Explicitly target ONLY the main executables instead of building everything
          cmake --build build --config Release --target llama-cli --parallel 4
          cmake --build build --config Release --target llama-server --parallel 4

      - name: Upload Finished Binaries Only
        uses: actions/upload-artifact@v4
        with:
          name: llama-turboquant-turing-cuda
          # STRICT PATHING: Tells Github to ONLY pull these two specific files
          path: |
            build/bin/Release/llama-cli.exe
            build/bin/Release/llama-server.exe
